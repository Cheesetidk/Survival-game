<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcology — Sector 04 Transit Junction</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050608;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: #d8dee9;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(5, 6, 8, 0.84);
        backdrop-filter: blur(4px);
        z-index: 10;
        cursor: pointer;
        text-align: center;
        padding: 24px;
      }
      #overlay.hidden {
        display: none;
      }
      #overlay h1 {
        font-size: 1.4rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #eceff4;
        margin-bottom: 12px;
      }
      #overlay p {
        font-size: 0.85rem;
        color: #8fbcbb;
        line-height: 1.8;
      }
      #reticle {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(236, 239, 244, 0.65);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      #prompt {
        position: fixed;
        top: calc(50% + 22px);
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        color: #ebcb8b;
        text-shadow: 0 1px 4px #000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.12s ease;
      }
      #prompt.visible {
        opacity: 1;
      }
      #status-tag {
        position: fixed;
        bottom: 42px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        color: #b48ead;
        text-shadow: 0 1px 4px #000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      #status-tag.visible {
        opacity: 1;
      }
      #stamina-wrap {
        position: fixed;
        bottom: 26px;
        left: 50%;
        transform: translateX(-50%);
        width: 180px;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      #stamina-wrap.active {
        opacity: 1;
      }
      #stamina-bar {
        width: 100%;
        height: 100%;
        background: #88c0d0;
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="reticle"></div>
    <div id="prompt">[E] CYCLE BLAST DOOR</div>
    <div id="status-tag">BIOMASS ENTANGLEMENT</div>
    <div id="stamina-wrap"><div id="stamina-bar"></div></div>

    <div id="overlay">
      <h1>SECTOR 04 // TRANSIT JUNCTION</h1>
      <p>
        CLICK TO ENTER MEGACORRIDOR<br />
        [WASD] Move  |  [SHIFT] Sprint  |  [C] Crouch  |  [SPACE] Jump<br />
        [F] Flashlight  |  [G] Chem-Light  |  [V] Deploy UV-C Lamp  |  [E] Door<br />
        [RIGHT-CLICK] Fire Grappling Hook  |  [R] Reel Winch
      </p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
